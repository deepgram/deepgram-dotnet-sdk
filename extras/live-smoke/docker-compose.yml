# Live-API smokes for the Flux ForceEndTurn and Agent management surfaces (PR #426).
# Run via ./run-smokes.sh, which validates the environment and asserts on the output.
# DEEPGRAM_API_KEY and DEEPGRAM_PROJECT_ID must be set in the host environment — both are passed
# through at run time and never stored in the image. DEEPGRAM_PROJECT_ID must identify a
# DISPOSABLE test project (deleted variable names stay reserved in it forever) and is handed
# only to the two agent services; the Flux smoke is project-agnostic and does not receive it.
services:
  flux-smoke:
    build:
      context: ../..
      dockerfile: extras/live-smoke/Dockerfile
    image: deepgram-dotnet-live-smoke
    environment:
      - DEEPGRAM_API_KEY
    working_dir: /app/flux-force-end-turn
    command: ["dotnet", "FluxForceEndTurn.dll"]

  agent-configurations-smoke:
    build:
      context: ../..
      dockerfile: extras/live-smoke/Dockerfile
    image: deepgram-dotnet-live-smoke
    environment:
      - DEEPGRAM_API_KEY
      - DEEPGRAM_PROJECT_ID
    working_dir: /app/agent-configurations
    command: ["dotnet", "AgentConfigurations.dll"]

  agent-variables-smoke:
    build:
      context: ../..
      dockerfile: extras/live-smoke/Dockerfile
    image: deepgram-dotnet-live-smoke
    environment:
      - DEEPGRAM_API_KEY
      - DEEPGRAM_PROJECT_ID
    working_dir: /app/agent-variables
    command: ["dotnet", "AgentVariables.dll"]
