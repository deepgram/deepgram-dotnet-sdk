name: Release Please

on:
  push:
    branches:
      - main
      - release-v*

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compile:
    name: Compile (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore dependencies
        run: dotnet restore Deepgram.sln
      - name: Build
        run: dotnet build Deepgram.sln --configuration Release --no-restore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore dependencies
        run: dotnet restore Deepgram.sln
      - name: Test
        run: dotnet test Deepgram.sln --no-restore

  release-please:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore dependencies
        run: dotnet restore Deepgram.sln
      - name: Build
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: dotnet build Deepgram.sln --configuration Release --no-restore -p:Version="$RELEASE_TAG"
      - name: Pack
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: dotnet pack Deepgram.sln --configuration Release --no-build --output ./dist -p:Version="$RELEASE_TAG"
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./dist/*.nupkg" --source nuget.org --api-key "$NUGET_API_KEY" --skip-duplicate

  context7:
    name: Update Context7 Documentation
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created && needs.publish.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
      - name: Update Context7 Documentation
        uses: rennf93/upsert-context7@1.1
        with:
          operation: refresh
